[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerling"
description = "A tiny, sandboxed, zero-dependency personal expense tracker CLI."
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
keywords = ["expenses", "budget", "finance", "cli"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.scripts]
ledgerling = "ledgerling.cli:main"

[project.urls]
Changelog = "https://example.invalid/ledgerling/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "ledgerling.cli.__version__" }
