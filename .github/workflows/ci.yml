name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No third-party dependencies: the suite runs against the source tree
      # (tests add src/ to the path themselves).
      - name: Run tests
        run: python -m unittest discover -s tests -v

      # Verify the package builds, installs, and exposes the console script.
      - name: Install package
        run: python -m pip install .

      - name: Smoke-test the CLI
        run: ledgerling version
